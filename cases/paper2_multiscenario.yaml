# Costa, Tonassi & Souza (2016), Chem. Eng. Trans. 52:1189-1194.
# "Hydraulic design optimization of multi-scenario cooling water distribution system".
# Same network as the grassroots problem of 2014, designed for four operating scenarios
# (Table 3) with control valves on every circuit; energy price 0.05 USD/kWh;
# traditional design by the Towler & Sinnott rule with the largest diameter over the scenarios.
name: "Paper 2 - multi-scenario design of the cooling water network"
description: "20 nodes, 23 edges, 5 heat exchangers, 4 operating scenarios with control valves"
author: "Andre L. H. Costa, Erica L. R. Tonassi, Jaime N. M. de Souza"
date: "2016"

fluid: {name: Cooling water, density: 995.0, viscosity: 0.72e-3, heat_capacity: 4187.0, inlet_temperature: 32.0}

network:
  nodes:
    - {id: 1,  tag: "Cooling tower basin", elevation: 0.0, pressure: 0.0}
    - {id: 10, tag: "Cooling tower top",   elevation: 5.0, pressure: 0.0}
  edges:
    - {id: 1,  from: 1,  to: 2}
    - {id: 2,  from: 2,  to: 3}
    - {id: 3,  from: 3,  to: 4}
    - {id: 4,  from: 4,  to: 5}
    - {id: 5,  from: 5,  to: 6}
    - {id: 6,  from: 7,  to: 8}
    - {id: 7,  from: 8,  to: 9}
    - {id: 8,  from: 9,  to: 10}
    - {id: 9,  from: 4,  to: 11}
    - {id: 10, from: 4,  to: 12}
    - {id: 11, from: 5,  to: 13}
    - {id: 12, from: 6,  to: 14}
    - {id: 13, from: 6,  to: 15}
    - {id: 14, from: 16, to: 9}
    - {id: 15, from: 17, to: 9}
    - {id: 16, from: 18, to: 8}
    - {id: 17, from: 19, to: 7}
    - {id: 18, from: 20, to: 7}
    - {id: 19, from: 11, to: 16}
    - {id: 20, from: 12, to: 17}
    - {id: 21, from: 13, to: 18}
    - {id: 22, from: 14, to: 19}
    - {id: 23, from: 15, to: 20}

pipes:   # Table 1
  - {edge: 1,  length: 10.0}
  - {edge: 3,  length: 200.0}
  - {edge: 4,  length: 100.0}
  - {edge: 5,  length: 100.0}
  - {edge: 6,  length: 100.0}
  - {edge: 7,  length: 100.0}
  - {edge: 8,  length: 200.0}
  - {edge: 9,  length: 25.0}
  - {edge: 10, length: 25.0}
  - {edge: 11, length: 25.0}
  - {edge: 12, length: 125.0}
  - {edge: 13, length: 25.0}
  - {edge: 14, length: 25.0}
  - {edge: 15, length: 25.0}
  - {edge: 16, length: 25.0}
  - {edge: 17, length: 125.0}
  - {edge: 18, length: 25.0}

pump: {edge: 2, tag: P-101, existing: false}

# Table 4. "Pump 0" is too small for this network (its LP is infeasible) and is kept
# to illustrate how infeasible alternatives are reported.
pump_catalog:
  - {tag: Pump 0, coefficients: [6.30, -27.0,  -83.12],  efficiency: 0.6, rated_flow: 0.0952764}
  - {tag: Pump 1, coefficients: [31.5, -135.0, -415.6],  efficiency: 0.6, rated_flow: 0.0952764}
  - {tag: Pump 2, coefficients: [37.8, -162.0, -498.7],  efficiency: 0.6, rated_flow: 0.0952764}
  - {tag: Pump 3, coefficients: [42.0, -180.0, -554.1],  efficiency: 0.6, rated_flow: 0.0952764}
  - {tag: Pump 4, coefficients: [46.2, -198.0, -609.5],  efficiency: 0.6, rated_flow: 0.0952764}

# Table 3: design (maximum) flow rates and head losses at the design condition.
exchangers:
  - {edge: 19, tag: E-101, design_flow: 12.4, design_head_loss: 5.53}
  - {edge: 20, tag: E-102, design_flow: 30.1, design_head_loss: 6.35}
  - {edge: 21, tag: E-103, design_flow: 37.4, design_head_loss: 4.82}
  - {edge: 22, tag: E-104, design_flow: 16.4, design_head_loss: 2.97}
  - {edge: 23, tag: E-105, design_flow: 3.2,  design_head_loss: 1.20}

economics:
  energy_price: 0.05        # USD/kWh (Section 3 of the paper)
  interest_rate: 0.12
  project_years: 20         # r = 0.134
  operating_hours: 8760
  pipe_cost: {c1: 7.0386, m: 1.4393}
  pump_cost: {fi: 2.8, fms: 1.3, fm: 1.35, b: [5.1029, -1.2217, 0.0771]}
  objective_basis: annualized

# Table 3: the plant operates the same amount of time in each scenario. The 0.01 kg/s
# values represent coolers that are not in service.
scenarios:
  - {name: Scenario 1, time_fraction: 0.25, flows: {E-101: 11.8, E-102: 28.7, E-103: 35.6, E-104: 15.6, E-105: 3.1}}
  - {name: Scenario 2, time_fraction: 0.25, flows: {E-101: 12.4, E-102: 30.1, E-103: 37.4, E-104: 15.6, E-105: 3.1}}
  - {name: Scenario 3, time_fraction: 0.25, flows: {E-101: 11.8, E-102: 0.01, E-103: 0.01, E-104: 15.6, E-105: 3.1}}
  - {name: Scenario 4, time_fraction: 0.25, flows: {E-101: 11.8, E-102: 28.7, E-103: 37.4, E-104: 16.4, E-105: 3.2}}

options:
  max_velocity: 3.7
  allow_valves: true
  traditional_method: towler
