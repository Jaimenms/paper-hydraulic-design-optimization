[project]
name = "cwnet"
version = "0.1.0"
description = "Hydraulic design optimization of cooling water pipe networks (split-pipe LP, revamp and multi-scenario) with rigorous network simulation"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Jaime N. M. de Souza" }]
keywords = ["cooling water", "pipe network", "hydraulic design", "linear programming", "process engineering"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering",
  "Intended Audience :: Science/Research",
]
dependencies = [
  "numpy>=1.26",
  "scipy>=1.11",
  "pandas>=2.0",
  "pydantic>=2.5",
  "pyyaml>=6.0",
  "networkx>=3.1",
  "matplotlib>=3.8",
]

[project.optional-dependencies]
notebooks = ["jupyter>=1.0", "ipykernel>=6.29", "nbformat>=5.9", "nbclient>=0.9", "nbconvert>=7.10"]
dev = ["pytest>=8.0", "pytest-cov>=4.1", "ruff>=0.4", "mypy>=1.8"]

[project.scripts]
cwnet = "cwnet.cli:main"

[build-system]
requires = ["hatchling>=1.21"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cwnet"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "W"]
ignore = ["N803", "N806", "E741"]

[tool.ruff.lint.per-file-ignores]
"scripts/*" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
